<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S.O Apontamentos - Produção e Qualidade</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b132b; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; }
    .card-custom { background-color: #1c2541; border: none; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 20px; }
    .form-control, .form-select { background-color: #0b132b; color: #fff; border: 1px solid #2d3e6b; font-size: 0.85rem; }
    .form-control:focus, .form-select:focus { background-color: #0b132b; color: #fff; border-color: #4cc9f0; box-shadow: none; }
    
    /* Estilo personalizado para destacar a fonte do campo de Máquina */
    .input-maquina {
      color: #ff9f1c !important; /* Cor amarela/laranja vibrante para destacar */
      font-weight: bold;
      text-align: center;
    }
    .input-maquina::placeholder {
      color: #718096 !important;
      font-weight: normal;
    }

    label, .form-label { color: #4cc9f0 !important; font-size: 0.8rem; font-weight: bold; }
    .table-dark-custom { background-color: #233055; color: #fff; }
    .table-dark-custom th { background-color: #0b132b; color: #4cc9f0; border-color: #2d3e6b; text-align: center; }
    .table-dark-custom td { background-color: #1c2541; color: #fff; border-color: #2d3e6b; vertical-align: middle; }
  </style>
</head>
<body>

  <div class="container-fluid">
    <!-- CABEÇALHO -->
    <div class="card card-custom d-flex flex-row justify-content-between align-items-center flex-wrap gap-3">
      <div>
        <h2 class="h4 mb-1 text-info">S.O Apontamentos — Chão de Fábrica</h2>
        <p class="small m-0 text-white">Registo de presenças e controlo por máquinas (1 a 13).</p>
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <a href="relatorio.html" class="btn btn-outline-light btn-sm">📊 Ver Relatórios</a>
        <a href="reclamacoes.html" class="btn btn-outline-warning btn-sm">⚠ Gestão de Reclamações</a>
      </div>
    </div>

    <!-- PAINEL DE LANÇAMENTO EM LOTE -->
    <div class="card card-custom">
      <div class="row g-3 align-items-end mb-3">
        <div class="col-md-3">
          <label class="form-label">Data do Apontamento:</label>
          <input type="text" id="dataApontamento" class="form-control" placeholder="DD/MM/AAAA">
        </div>
        <div class="col-md-3">
          <label class="form-label">Turno Padrão (Aplicado a Todos):</label>
          <select id="turnoGlobal" class="form-select">
            <option value="06h às 14h">06h às 14h (1º Turno)</option>
            <option value="14h às 22h" selected>14h às 22h (2º Turno)</option>
            <option value="22h às 06h">22h às 06h (3º Turno)</option>
          </select>
        </div>
        <div class="col-md-6 text-end">
          <button class="btn btn-success fw-bold px-4" onclick="salvarApontamentosLote()">💾 Gravar Apontamentos do Dia</button>
        </div>
      </div>

      <!-- TABELA DE FUNCIONÁRIOS E MÁQUINAS (SEM COLUNA DE TURNO INDIVIDUAL) -->
      <div class="table-responsive">
        <table class="table table-dark-custom table-hover">
          <thead>
            <tr>
              <th>Funcionário</th>
              <th class="text-center" style="width: 160px;">Máquina(s) (1-13)</th>
              <th class="text-center" style="width: 250px;">Ocorrência / Status</th>
              <th>Observações / Justificativa</th>
            </tr>
          </thead>
          <tbody id="tabelaApontamentos">
            <tr><td colspan="4" class="text-center text-muted">A carregar funcionários da aba Resumo...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyt0-k9jkWcIHe4nQcgjyWe_PADniW1q1SLLB3gdPbHKcXIjllPyZVpRl7C-mQ1cp32_w/exec";
    let funcionariosGlobais = [];

    window.onload = function() {
      let hoje = new Date();
      let d = String(hoje.getDate()).padStart(2, '0');
      let m = String(hoje.getMonth() + 1).padStart(2, '0');
      let a = hoje.getFullYear();
      document.getElementById('dataApontamento').value = `${d}/${m}/${a}`;

      carregarFuncionarios();
    };

    function carregarFuncionarios() {
      fetch(`${API_URL}?action=getFuncionarios`)
        .then(res => res.json())
        .then(data => {
          funcionariosGlobais = data;
          renderizarTabelaFuncionarios(data);
        })
        .catch(err => {
          console.error("Erro ao carregar funcionários:", err);
          document.getElementById('tabelaApontamentos').innerHTML = `<tr><td colspan="4" class="text-center text-danger">Erro ao comunicar com o Google Sheets.</td></tr>`;
        });
    }

    function renderizarTabelaFuncionarios(lista) {
      let tbody = document.getElementById('tabelaApontamentos');
      tbody.innerHTML = '';

      if (!lista || lista.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted">Nenhum funcionário encontrado na aba Resumo.</td></tr>`;
        return;
      }

      lista.forEach((func, idx) => {
        let maqAtribuida = func.maquina || ''; 
        
        tbody.innerHTML += `
          <tr data-index="${idx}">
            <td class="fw-bold text-info align-middle">${func.nome}</td>
            <td class="text-center align-middle">
              <input type="text" class="form-control input-maquina" value="${maqAtribuida}" placeholder="Ex: 1, 4">
            </td>
            <td class="text-center align-middle">
              <select class="form-select select-ocorrencia">
                <option value="Presente (Normal)">Presente (Normal)</option>
                <option value="Falta Justificada">Falta Justificada</option>
                <option value="Falta Injustificada">Falta Injustificada</option>
                <option value="Atraso / Saída Antecipada">Atraso / Saída Antecipada</option>
              </select>
            </td>
            <td class="align-middle">
              <input type="text" class="form-control input-obs" placeholder="Detalhes opcionais...">
            </td>
          </tr>
        `;
      });
    }

    function salvarApontamentosLote() {
      let dataApont = document.getElementById('dataApontamento').value;
      let turnoGlobal = document.getElementById('turnoGlobal').value;

      if (!dataApont) {
        alert("Por favor, preencha a data do apontamento.");
        return;
      }

      let linhas = document.querySelectorAll('#tabelaApontamentos tr[data-index]');
      let apontamentosLote = [];

      linhas.forEach(linha => {
        let nomeFunc = linha.querySelector('.text-info').innerText;
        let maquina = linha.querySelector('.input-maquina').value;
        let ocorrencia = linha.querySelector('.select-ocorrencia').value;
        let obs = linha.querySelector('.input-obs').value;

        // Incorpora a informação da máquina na observação enviada para a planilha
        let obsCompleta = `Máq: ${maquina || 'N/D'}` + (obs ? ` | ${obs}` : '');

        apontamentosLote.push({
          data: dataApont,
          nome: nomeFunc,
          turno: turnoGlobal,
          ocorrencia: ocorrencia,
          obs: obsCompleta
        });
      });

      let payload = {
        action: "salvarLote",
        apontamentos: apontamentosLote
      };

      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify(payload),
        headers: { "Content-Type": "text/plain;charset=utf-8" }
      })
      .then(res => res.json())
      .then(resposta => {
        alert(resposta.mensagem || "Apontamentos gravados com sucesso!");
      })
      .catch(err => {
        alert("Erro ao gravar apontamentos: " + err.message);
      });
    }
  </script>
</body>
</html>
