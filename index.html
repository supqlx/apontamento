<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle de Apontamentos - Operação</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      min-height: 100vh;
      background-color: #0b132b;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
    }
    .container {
      max-width: 600px;
      padding: 20px;
      margin-top: 20px;
    }
    .card-custom { 
      background-color: #1c2541; 
      border: none; 
      border-radius: 12px; 
      padding: 25px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.4); 
    }
    .form-control, .form-select { 
      background-color: #0b132b; 
      color: #fff; 
      border: 1px solid #2d3e6b; 
    }
    .form-control:focus, .form-select:focus { 
      background-color: #0b132b; 
      color: #fff; 
      border-color: #4cc9f0; 
      box-shadow: none; 
    }
    label, .form-label { color: #4cc9f0 !important; font-weight: 600; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card card-custom">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="h5 text-info m-0">📝 Registo de Apontamento Diário</h3>
        <a href="relatorio.html" class="btn btn-outline-light btn-sm">📊 Ver Relatórios</a>
      </div>

      <form id="formApontamento" onsubmit="enviarApontamento(event)">
        
        <!-- DATA -->
        <div class="mb-3">
          <label class="form-label">Data:</label>
          <input type="date" id="data" class="form-control" required>
        </div>

        <!-- FUNCIONÁRIO -->
        <div class="mb-3">
          <label class="form-label">Funcionário:</label>
          <input type="text" id="nome" class="form-control" list="listaFuncionarios" placeholder="Selecione ou digite o nome..." required>
          <datalist id="listaFuncionarios">
            <option value="A carregar...">
          </datalist>
        </div>

        <!-- TURNO -->
        <div class="mb-3">
          <label class="form-label">Turno:</label>
          <select id="turno" class="form-select" required>
            <option value="">Selecione o turno...</option>
            <option value="06h às 14h">06h às 14h</option>
            <option value="14h às 22h">14h às 22h</option>
            <option value="22h às 06h">22h às 06h</option>
          </select>
        </div>

        <!-- STATUS / OCORRÊNCIA -->
        <div class="mb-3">
          <label class="form-label">Status / Ocorrência:</label>
          <select id="ocorrencia" class="form-select" onchange="verificarOcorrencia()" required>
            <option value="Presente">Presente (Normal)</option>
            <option value="Presente + Atraso">Presente com Atraso</option>
            <option value="Presente + Saída Antecipada">Presente com Saída Antecipada</option>
            <option value="Falta">Falta</option>
          </select>
        </div>

        <!-- CAMPO DINÂMICO DE HORÁRIOS / OBSERVAÇÃO -->
        <div class="mb-4" id="blocoObs" style="display: none;">
          <label class="form-label" id="labelObs">Detalhes do Horário / Justificativa:</label>
          <input type="text" id="obs" class="form-control" placeholder="Ex: 08:00 às 10:00 ou motivo da falta">
          <small class="text-warning" id="avisoObs" style="font-size: 0.75rem;"></small>
        </div>

        <!-- BOTÃO DE ENVIO -->
        <button type="submit" id="btnSalvar" class="btn btn-info w-100 fw-bold py-2">Salvar Apontamento</button>
      </form>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyt0-k9jkWcIHe4nQcgjyWe_PADniW1q1SLLB3gdPbHKcXIjllPyZVpRl7C-mQ1cp32_w/exec";

    window.onload = function() {
      // Define a data de hoje por defeito no input
      document.getElementById('data').valueAsDate = new Date();
      carregarListaFuncionarios();
    };

    function carregarListaFuncionarios() {
      fetch(`${API_URL}?action=getRelatorio`)
        .then(res => res.json())
        .then(dados => {
          const datalist = document.getElementById('listaFuncionarios');
          const funcionarios = [...new Set(dados.map(item => item.nome))].sort();
          datalist.innerHTML = '';
          funcionarios.forEach(nome => {
            let opt = document.createElement('option');
            opt.value = nome;
            datalist.appendChild(opt);
          });
        })
        .catch(err => console.error("Erro ao carregar lista de funcionários:", err));
    }

    function verificarOcorrencia() {
      const oc = document.getElementById('ocorrencia').value;
      const blocoObs = document.getElementById('blocoObs');
      const labelObs = document.getElementById('labelObs');
      const avisoObs = document.getElementById('avisoObs');
      const campoObs = document.getElementById('obs');

      if (oc === "Presente") {
        blocoObs.style.display = 'none';
        campoObs.value = '';
      } else {
        blocoObs.style.display = 'block';
        if (oc.includes("Atraso") || oc.includes("Saída")) {
          labelObs.innerText = "Intervalo do Horário Perdido:";
          avisoObs.innerText = "Formato recomendado: 08:00 às 10:00";
        } else {
          labelObs.innerText = "Justificativa da Falta:";
          avisoObs.innerText = "Ex: Consulta médica, atestado, etc.";
        }
      }
    }

    function enviarApontamento(e) {
      e.preventDefault();
      
      const btn = document.getElementById('btnSalvar');
      btn.disabled = true;
      btn.innerText = "A guardar...";

      // Formatar a data de AAAA-MM-DD para DD/MM/AAAA para manter padrão na planilha
      const dataRaw = document.getElementById('data').value;
      const partes = dataRaw.split('-');
      const dataFormatada = `${partes[2]}/${partes[1]}/${partes[0]}`;

      const dados = {
        data: dataFormatada,
        nome: document.getElementById('nome').value.trim(),
        turno: document.getElementById('turno').value,
        ocorrencia: document.getElementById('ocorrencia').value,
        obs: document.getElementById('obs').value.trim()
      };

      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify(dados),
        headers: { "Content-Type": "text/plain;charset=utf-8" }
      })
      .then(res => res.text())
      .then(resposta => {
        alert("Apontamento guardado com sucesso!");
        document.getElementById('formApontamento').reset();
        document.getElementById('data').valueAsDate = new Date();
        document.getElementById('blocoObs').style.display = 'none';
        btn.disabled = false;
        btn.innerText = "Salvar Apontamento";
        carregarListaFuncionarios();
      })
      .catch(err => {
        alert("Erro ao guardar apontamento: " + err.message);
        btn.disabled = false;
        btn.innerText = "Salvar Apontamento";
      });
    }
  </script>
</body>
</html>
